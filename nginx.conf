# Serves the prerendered site built by Dockerfile. Copied to
# /etc/nginx/conf.d/default.conf, which nginx includes inside `http`.
#
# Unlike the SPA siblings (toyfolio, scaven-family, ombrellone) this site is a
# real multi-page site: every route is prerendered to its own HTML file, so
# there is NO catch-all fallback to index.html. An unknown path must 404, or
# every typo'd URL would return HTTP 200 with the home page and crawlers would
# index duplicates of it.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # SvelteKit's hashed, content-addressed build output: cache it forever.
    # `^~` stops nginx evaluating the regex location below, which would
    # otherwise win for .js/.css and downgrade them to the one-day policy.
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Unhashed assets (favicons, fonts, images, the CV PDF, robots/sitemap).
    # A day is short enough that a replaced file surfaces quickly.
    location ~* \.(?:css|js|map|png|jpe?g|svg|ico|webp|woff2?|pdf|txt|xml|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Prerendered pages: `/cv/` resolves to `/cv/index.html`. A page must never
    # be cached — it references hashed bundles, so a stale copy would point at
    # bundles that no longer exist after a deploy and break the load.
    # /_app/version.json also lands here, which is correct: SvelteKit polls it
    # to detect a new deploy, so a cached copy would defeat the check.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/index.html =404;
    }

    # adapter-static writes this shell (svelte.config.js `fallback`). Serving it
    # as the 404 body keeps the site's own styling and nav on a dead link while
    # still returning HTTP 404. `internal` hides it from direct requests.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
