# Serves the prerendered site built by Dockerfile and proxies /api/ to the
# AI version's Node API on 127.0.0.1:8787 (see docker/entrypoint.sh). Copied
# to /etc/nginx/conf.d/default.conf, which nginx includes inside `http`.
#
# Unlike the SPA siblings (toyfolio, scaven-family, ombrellone) this site is a
# real multi-page site: every route is prerendered to its own HTML file, so
# there is NO catch-all fallback to index.html. An unknown path must 404, or
# every typo'd URL would return HTTP 200 with the home page and crawlers would
# index duplicates of it.

# The visitor's address for the API's per-IP limits: Fly's edge sets
# Fly-Client-IP (and overwrites any client-sent copy); anywhere else, the peer.
map $http_fly_client_ip $ai_client_ip {
    ""      $remote_addr;
    default $http_fly_client_ip;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # The AI API (it sets its own Cache-Control: no-store). Generations take
    # tens of seconds, hence the long read timeout; requests are small JSON,
    # hence the tight body limit.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Client-IP $ai_client_ip;
        proxy_read_timeout 150s;
        client_max_body_size 64k;
    }

    # SvelteKit's hashed, content-addressed build output: cache it forever.
    # `^~` stops nginx evaluating the regex location below, which would
    # otherwise win for .js/.css and downgrade them to the one-day policy.
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Unhashed assets (favicons, fonts, images, the CV PDF, robots/sitemap).
    # A day is short enough that a replaced file surfaces quickly.
    location ~* \.(?:css|js|map|png|jpe?g|svg|ico|webp|woff2?|pdf|txt|xml|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Prerendered pages: `/cv/` resolves to `/cv/index.html`. A page must never
    # be cached — it references hashed bundles, so a stale copy would point at
    # bundles that no longer exist after a deploy and break the load.
    # /_app/version.json also lands here, which is correct: SvelteKit polls it
    # to detect a new deploy, so a cached copy would defeat the check.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/index.html =404;
    }

    # adapter-static writes this shell (svelte.config.js `fallback`). Serving it
    # as the 404 body keeps the site's own styling and nav on a dead link while
    # still returning HTTP 404. `internal` hides it from direct requests.
    # `always` is required: nginx drops add_header on error responses, so
    # without it the 404 body would go out with no Cache-Control at all and a
    # proxy would be free to cache it.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
