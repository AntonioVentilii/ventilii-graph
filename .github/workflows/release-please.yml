name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      # Tags cut with GITHUB_TOKEN don't trigger the tag workflows; dispatch them instead.
      # A PAT-cut tag does trigger them, so skip the dispatch to avoid double runs.
      - name: Trigger deploy + publish for the new release
        if: ${{ steps.release.outputs.release_created == 'true' && secrets.RELEASE_PLEASE_PAT == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
