name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      # create-github-app-token fails opaquely when these are unset, which is easy to
      # hit because they must be provisioned per repository. Say so plainly instead.
      - name: Check release bot credentials are configured
        env:
          APP_ID: ${{ vars.RELEASE_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$APP_ID" ] || missing+=('variable RELEASE_BOT_APP_ID')
          [ -n "$PRIVATE_KEY" ] || missing+=('secret RELEASE_BOT_PRIVATE_KEY')

          if [ ${#missing[@]} -eq 0 ]; then
            echo 'Release bot credentials are configured.'
            exit 0
          fi

          for item in "${missing[@]}"; do
            echo "::error::Release bot credential not configured: $item"
          done
          echo 'Add them under Settings > Secrets and variables > Actions, and make sure the release bot GitHub App is installed on this repository.'
          exit 1

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@0b6b3fc0186a2f7118bfd88fab9ea481e1839504 # v4.4.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
