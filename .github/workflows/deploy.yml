name: Deploy

# Ships the site to Fly.io on every new version. release-please cuts a `vX.Y.Z`
# tag when its release PR merges, and that tag push triggers this workflow.
#
# REQUIRES one repo secret, `FLY_API_TOKEN`, scoped to this app alone:
#   fly tokens create deploy
# The site is fully prerendered and has no runtime configuration, so CI only
# builds and ships the image — there are no secrets to inject at run time.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One deploy per ref at a time; never cancel a deploy mid-flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Only ever deploy a RELEASED version: a workflow_dispatch has to be run
    # against a v* tag, not against a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      # Built on Fly's remote builder from the Dockerfile, so the runner needs
      # no Docker and no node toolchain of its own.
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
