# Security headers for every response, included by nginx.conf. Copied to
# /etc/nginx/snippets/ by the Dockerfile.
#
# nginx drops a server's add_header in any location that sets its own, so
# nginx.conf includes this at server level (for /api/) AND in every location
# with an add_header. `always` keeps them on error responses (the 404 page).
#
# The CSP only sets directives that cannot break the prerendered pages: no
# script-src, because app.html's theme script, SvelteKit's bootstrap and the
# JSON-LD are inline. No HSTS: the whole .dev TLD is on the browsers' HSTS
# preload list, so ventilii.dev is HTTPS-only already.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
