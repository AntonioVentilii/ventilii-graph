<!doctype html>
<html lang="en">
	<head>
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					var dark =
						t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.classList.toggle('light', !dark);
				} catch (e) {}
			})();
		</script>
		<meta charset="utf-8" />
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/favicons/favicon-96x96.png"
			sizes="96x96"
		/>
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicons/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/favicons/apple-touch-icon.png"
		/>
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Interactive career map: experience, projects, stack, and education. Senior Software Engineer specializing in TypeScript, Rust, and Finance / Web3 systems."
		/>
		<meta property="og:title" content="Antonio Ventilii | Senior Software Engineer" />
		<meta
			property="og:description"
			content="Full-stack development, Web3, and desk automation. Exploring the intersection of finance and technology."
		/>
		<meta property="og:image" content="https://ventilii.dev/images/antonio-ventilii.jpg" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://ventilii.dev/" />
		<meta name="twitter:card" content="summary" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Antonio Ventilii",
				"jobTitle": "Senior Software Engineer",
				"url": "https://ventilii.dev/",
				"image": "https://ventilii.dev/images/antonio-ventilii.jpg",
				"description": "Senior Software Engineer specializing in TypeScript, Rust, and Python.",
				"worksFor": {
					"@type": "Organization",
					"name": "DFINITY Foundation",
					"url": "https://dfinity.org"
				},
				"address": {
					"@type": "PostalAddress",
					"addressLocality": "Zurich",
					"addressCountry": "CH"
				},
				"knowsAbout": [
					"AI agents and agentic engineering",
					"TypeScript",
					"Rust",
					"Python",
					"Svelte",
					"Web3",
					"Internet Computer",
					"Quantitative finance"
				],
				"sameAs": ["https://github.com/AntonioVentilii", "https://linkedin.com/in/AntonioVentilii"]
			}
		</script>
		%sveltekit.head%

		<title>Antonio Ventilii | portfolio</title>

		<!-- Font preloads -->
		<link
			rel="preload"
			href="/fonts/jetbrainsmono-regular.woff2"
			as="font"
			type="font/woff"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/jetbrainsmono-bold.woff2"
			as="font"
			type="font/woff"
			crossorigin
		/>
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-page text-fg antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
